name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  brew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install formula from source
        run: brew install --build-from-source ./Formula/avalan.rb
      - name: Test formula
        run: brew test avalan
